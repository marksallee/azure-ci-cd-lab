name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is handled by cd.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s app/tests -v

  dotnet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test dotnet/BuildInfo.Tests --configuration Release

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      # The Proxmox runner container config is validated too (no Proxmox access needed)
      - run: terraform fmt -check -recursive
        working-directory: deploy/homelab/terraform
      - run: terraform init -backend=false
        working-directory: deploy/homelab/terraform
      - run: terraform validate
        working-directory: deploy/homelab/terraform

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: azure-ci-cd-lab:ci
